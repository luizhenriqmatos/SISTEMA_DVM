<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVM // Atrasos & Penalidades Cloud</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Bibliotecas para PDF e Email -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#09090b',
                            panel: '#111115',
                            border: '#27272a',
                            blue: '#1e3a8a',
                            glow: '#3b82f6',
                            text: '#e4e4e7',
                            muted: '#71717a',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #09090b; color: #e4e4e7; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        .cyber-input { background: transparent; border: 1px solid #27272a; color: #e4e4e7; transition: all 0.2s ease; }
        .cyber-input:focus:not(:read-only) { outline: none; border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.15); }
        .scanline { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1)); background-size: 100% 4px; pointer-events: none; z-index: 50; opacity: 0.15; }
    </style>

    <!-- React 18 e Babel Standalone para rodar JSX direto no navegador -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="selection:bg-cyber-glow selection:text-black pb-12">
    <div class="scanline"></div>
    <div id="root"></div>

    <!-- Mapeamento de Módulos ES para Carregar Firebase v11 Nativo no Navegador -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/analytics": "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAnalytics } from 'firebase/analytics';
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';

        const { useState, useEffect, useRef } = React;

        // Credenciais estáticas para o painel administrativo local
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "admin123";

        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE (SUAS CREDENCIAIS INSERIDAS AQUI)
        // ==========================================
        const configFirebasePadrao = {
            apiKey: "AIzaSyAAegPv8UxpRUtHDQ6ioux-ZlBjLndpVio",
            authDomain: "banco-de-dados-5542e.firebaseapp.com",
            projectId: "banco-de-dados-5542e",
            storageBucket: "banco-de-dados-5542e.firebasestorage.app",
            messagingSenderId: "748571716289",
            appId: "1:748571716289:web:1d0e42cffbe466e39f0240",
            measurementId: "G-3Z5TR8GXRC"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? { ...JSON.parse(__firebase_config), apiKey: configFirebasePadrao.apiKey } 
            : configFirebasePadrao;

        // Inicializando os módulos com suas credenciais
        const app = initializeApp(firebaseConfig);
        
        let analytics;
        try {
            analytics = getAnalytics(app);
        } catch (e) {
            console.warn("Analytics não suportado neste ambiente");
        }

        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Caminho seguro para a coleção (evitando conflitos com regras)
        const DB_COLLECTION = 'dvm_painel_dados';
        const DB_DOC_ID = 'colaboradores_state_main';

        // Colaboradores iniciais caso o banco esteja vazio
        const COLABORADORES_INICIAIS = [
            "André", "Cleyton", "Danilo", "Henrique Lebre", 
            "Henrique Matos", "Kostantinos", "Liesley", 
            "Nailson", "Thiago Sodré", "Thiago Vitoria"
        ].sort().map(nome => ({
            id: nome.toLowerCase().replace(/ /g, '-'),
            nome: nome,
            atrasos: 0,
            justificativa: '',
            remotosPerdidos: 0
        }));

        const App = () => {
            // CORREÇÃO AQUI: Começamos com a lista preenchida para nunca ficar vazio!
            const [colaboradores, setColaboradores] = useState(COLABORADORES_INICIAIS);
            const [isAdmin, setIsAdmin] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [logs, setLogs] = useState([]);
            const [showSaved, setShowSaved] = useState(false);
            const [user, setUser] = useState(null);
            
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [emailDestino, setEmailDestino] = useState('');

            const fileInputRef = useRef(null);

            const addLog = (msg) => {
                const time = new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                const newLog = `> [${time}] ${msg}`;
                setLogs(prev => [newLog, ...prev].slice(0, 5));
            };

            // 1. Inicializa Conexão e Autenticação com a Nuvem
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        addLog('SYSTEM: Iniciando conexão com a nuvem...');
                        // No GitHub Pages usaremos o login Anônimo para ter permissão de ler o banco
                        await signInAnonymously(auth);
                    } catch (err) {
                        addLog(`ERROR Auth Cloud: Você ativou o login Anônimo no Firebase? (${err.message})`);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        addLog('SYSTEM: Conectado com sucesso ao Firebase Cloud.');
                    }
                });

                // Carrega status de Admin local da sessão atual
                if (localStorage.getItem('sysctrl_token') === 'local-admin-granted') {
                    setIsAdmin(true);
                }

                return () => unsubscribe();
            }, []);

            // 2. Escuta mudanças em Tempo Real no Banco de Dados (Sincronização imediata)
            useEffect(() => {
                if (!user) return; // Só tenta buscar depois de estar autenticado

                const docRef = doc(db, DB_COLLECTION, DB_DOC_ID);

                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        if (cloudData && Array.isArray(cloudData.list) && cloudData.list.length > 0) {
                            setColaboradores(cloudData.list);
                            addLog('CLOUD: Banco atualizado e sincronizado em tempo real.');
                        }
                    } else {
                        // Banco está vazio na nuvem: cria o documento com a lista inicial
                        setDoc(docRef, { list: COLABORADORES_INICIAIS })
                            .then(() => {
                                addLog('CLOUD: Banco de dados inicializado pela primeira vez.');
                            })
                            .catch(err => {
                                addLog(`ERROR Gravação Firebase: Verifique as regras do Firestore!`);
                            });
                    }
                }, (error) => {
                    addLog(`ERROR Sincronização: ${error.message}`);
                });

                return () => unsubscribe();
            }, [user]);

            // Grava alterações de forma persistente na Nuvem
            const atualizarDadosNoBanco = async (novosDados) => {
                setColaboradores(novosDados); // Atualiza na tela na hora
                
                if (!user) {
                    addLog('ERROR: Sem conexão de segurança autenticada com Firebase. Salvo apenas localmente.');
                    return;
                }
                
                try {
                    const docRef = doc(db, DB_COLLECTION, DB_DOC_ID);
                    await setDoc(docRef, { list: novosDados });
                    setShowSaved(true);
                    setTimeout(() => setShowSaved(false), 1500);
                } catch (err) {
                    addLog(`ERROR Gravando Banco: Verifique as regras do Firestore!`);
                }
            };

            // --- LÓGICA DE ALTERAÇÃO DOS DADOS ---
            const alterarAtraso = (id, nome, delta) => {
                if (!isAdmin) return;
                const novosDados = colaboradores.map(colab => {
                    if (colab.id === id) {
                        const novoValor = Math.max(0, colab.atrasos + delta);
                        return { ...colab, atrasos: novoValor };
                    }
                    return colab;
                });
                atualizarDadosNoBanco(novosDados);
                addLog(`ADMIN: ${delta > 0 ? '+1' : '-1'} atraso para ${nome}.`);
            };

            const alterarRemotosPerdidos = (id, nome, delta) => {
                if (!isAdmin) return;
                const novosDados = colaboradores.map(colab => {
                    if (colab.id === id) {
                        const atual = colab.remotosPerdidos || 0;
                        return { ...colab, remotosPerdidos: Math.max(0, atual + delta) };
                    }
                    return colab;
                });
                atualizarDadosNoBanco(novosDados);
                addLog(`ADMIN: Ajuste de remoto (${delta > 0 ? '+1' : '-1'}) para ${nome}.`);
            };

            const handleJustificativaKeyDown = (e, id, nome, justificativaAtual) => {
                if (e.key === 'Enter' && e.target.value.trim() !== '') {
                    const text = e.target.value.trim();
                    const data = new Date().toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
                    const novaEntrada = `[${data}] ${text}`;
                    const novoTexto = justificativaAtual ? `${justificativaAtual}; ${novaEntrada}` : novaEntrada;
                    
                    const novosDados = colaboradores.map(colab => 
                        colab.id === id ? { ...colab, justificativa: novoTexto } : colab
                    );
                    
                    atualizarDadosNoBanco(novosDados);
                    addLog(`ADMIN: Nova justificativa adicionada para ${nome}.`);
                    e.target.value = ''; 
                }
            };

            const zerarSemana = () => {
                if (window.confirm("ATENÇÃO: Deseja realmente zerar os atrasos e remotos de TODOS os colaboradores na nuvem?")) {
                    const zerados = colaboradores.map(c => ({...c, atrasos: 0, remotosPerdidos: 0, justificativa: ''}));
                    atualizarDadosNoBanco(zerados);
                    addLog('ADMIN: Semana resetada na nuvem para todos.');
                }
            };

            // --- EXPORTAÇÕES E BACKUPS ---
            const exportarDadosJSON = () => {
                const dadosString = JSON.stringify(colaboradores, null, 2);
                const blob = new Blob([dadosString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `dvm_backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                addLog('SYSTEM: Backup local exportado.');
            };

            const importarDadosJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const dadosImportados = JSON.parse(event.target.result);
                        if (Array.isArray(dadosImportados)) {
                            atualizarDadosNoBanco(dadosImportados);
                            addLog('ADMIN: Backup importado e atualizado na nuvem!');
                        } else {
                            addLog('ERROR: Formato de arquivo inválido.');
                        }
                    } catch (err) {
                        addLog('ERROR: Erro ao ler arquivo.');
                    }
                };
                reader.readAsText(file);
            };

            const gerarDocumentoPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("helvetica", "bold");
                doc.setFontSize(18);
                doc.text("SYS.DVM - Relatório de Atrasos e Penalidades", 14, 22);
                doc.setFontSize(11);
                doc.setFont("helvetica", "normal");
                doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}`, 14, 30);

                const tableColumn = ["Colaborador", "Atrasos", "Justificativas", "Remotos Perdidos"];
                const tableRows = [];

                colaboradores.forEach(colab => {
                    const remotosManuais = colab.remotosPerdidos || 0;
                    const totalRemotos = Math.max(0, Math.floor(colab.atrasos / 2) + remotosManuais);
                    const justificativasStr = colab.justificativa 
                        ? colab.justificativa.split(';').map(j => j.trim()).join('\n') 
                        : 'Sem registros';
                    tableRows.push([colab.nome, colab.atrasos, justificativasStr, totalRemotos]);
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 35,
                    theme: 'grid',
                    styles: { fontSize: 9, cellPadding: 3 },
                    headStyles: { fillColor: [30, 58, 138] },
                    columnStyles: { 2: { cellWidth: 80 } }
                });
                return doc;
            };

            const exportarPDF = () => {
                const doc = gerarDocumentoPDF();
                doc.save(`dvm_relatorio_${new Date().toISOString().slice(0,10)}.pdf`);
                addLog('SYSTEM: Relatório PDF baixado.');
            };

            const enviarEmail = async (e) => {
                e.preventDefault();
                if (!emailDestino) return;
                const docPdf = gerarDocumentoPDF();
                const pdfBlob = docPdf.output('blob');
                const reader = new FileReader();

                reader.onloadend = async () => {
                    const base64data = reader.result.split(',')[1];
                    try {
                        await emailjs.send('service_hcr466r', 'template_qe7xeau', {
                            to_email: emailDestino,
                            message: 'Relatório atualizado do painel SYS.DVM.',
                            attachment: base64data
                        }, '_WQ4zuCXJ_AQfI4Sf');
                        addLog(`SYSTEM: Email enviado para ${emailDestino}.`);
                        setEmailDestino('');
                    } catch (error) {
                        addLog('ERROR: Falha de envio via EmailJS.');
                    }
                };
                reader.readAsDataURL(pdfBlob);
            };

            // --- AUTENTICAÇÃO ADMINISTRATIVA LOCAL ---
            const handleLogin = (e) => {
                e.preventDefault();
                if (loginUser === ADMIN_USER && loginPass === ADMIN_PASS) {
                    setIsAdmin(true);
                    setLoginError(false);
                    setLoginUser('');
                    setLoginPass('');
                    localStorage.setItem('sysctrl_token', 'local-admin-granted');
                    addLog('AUTH: Acesso administrativo ativado com sucesso.');
                } else {
                    setLoginError(true);
                    addLog('AUTH: Falha ao autenticar. Credenciais inválidas.');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                localStorage.removeItem('sysctrl_token');
                addLog('AUTH: Sessão de administrador encerrada.');
            };

            const colaboradoresFiltrados = colaboradores.filter(c => 
                c.nome.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto">
                        
                        {/* HEADER */}
                        <header className="flex flex-col md:flex-row justify-between items-end md:items-center mb-8 pb-4 border-b border-cyber-border gap-4">
                            <div className="flex items-center gap-4 w-full md:w-auto">
                                <div className="w-3 h-8 bg-cyber-blue animate-pulse"></div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-mono font-bold tracking-tight text-cyber-text">
                                        SYS.DVM<span className="text-cyber-blue">_</span>
                                    </h1>
                                    <p className="text-xs font-mono text-cyber-muted uppercase tracking-widest">
                                        Atrasos & Penalidades // Realtime Cloud
                                    </p>
                                </div>
                            </div>

                            {/* CONTROLES */}
                            <div className="w-full md:w-auto flex flex-wrap justify-between md:justify-end items-center gap-4">
                                <div className="flex items-center gap-2 border-r border-cyber-border pr-4 flex-wrap">
                                    <button 
                                        onClick={exportarPDF} 
                                        title="Baixar Relatório PDF"
                                        className="text-xs font-mono px-3 py-1 border border-cyber-border text-cyber-muted hover:text-cyber-text hover:border-cyber-glow transition-colors"
                                    >
                                        [PDF]
                                    </button>
                                    
                                    <button 
                                        onClick={exportarDadosJSON} 
                                        title="Backup JSON local"
                                        className="text-xs font-mono px-3 py-1 border border-cyber-border text-purple-400 hover:border-purple-400 hover:bg-purple-400/10 transition-colors"
                                    >
                                        [BACKUP]
                                    </button>

                                    {isAdmin && (
                                        <>
                                            <input type="file" ref={fileInputRef} onChange={importarDadosJSON} accept=".json" className="hidden" />
                                            <button 
                                                onClick={() => fileInputRef.current.click()} 
                                                className="text-xs font-mono px-3 py-1 border border-cyber-border text-amber-500 hover:border-amber-500 hover:bg-amber-500/10 transition-colors"
                                            >
                                                [RESTAURAR]
                                            </button>
                                        </>
                                    )}

                                    <form onSubmit={enviarEmail} className="flex gap-1">
                                        <input type="email" placeholder="AINDA INDISPONIVEL" value={emailDestino} onChange={(e) => setEmailDestino(e.target.value)} className="cyber-input text-xs w-32 px-2 py-1 outline-none font-mono" />
                                        <button type="submit" className="text-xs font-mono px-2 py-1 border border-cyber-border text-cyber-muted hover:text-cyber-glow transition-colors">
                                            [ENVIAR]
                                        </button>
                                    </form>
                                </div>

                                {isAdmin ? (
                                    <div className="flex items-center gap-3 text-sm font-mono flex-wrap">
                                        <button onClick={zerarSemana} className="text-xs px-3 py-1 border border-cyber-danger/50 text-cyber-danger hover:bg-cyber-danger/10 transition-colors">
                                            [RESETAR_BANCO]
                                        </button>
                                        <span className="text-emerald-400 flex items-center gap-2 text-xs">
                                            <span className="w-2 h-2 bg-emerald-400 rounded-full inline-block animate-pulse"></span>
                                            ADMIN_CLOUD
                                        </span>
                                        <button onClick={handleLogout} className="px-3 py-1 text-xs border border-cyber-border hover:border-cyber-danger hover:text-cyber-danger transition-colors text-cyber-muted">
                                            [SAIR]
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleLogin} className="flex flex-wrap items-center gap-2 text-xs font-mono">
                                        <span className="text-cyber-glow">{">"}</span>
                                        <input type="text" placeholder="usuário" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} className={`w-16 bg-transparent border-b ${loginError ? 'border-cyber-danger text-cyber-danger' : 'border-cyber-border focus:border-cyber-glow'} px-1 py-1 outline-none`} />
                                        <input type="password" placeholder="senha" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} className={`w-20 bg-transparent border-b ${loginError ? 'border-cyber-danger text-cyber-danger' : 'border-cyber-border focus:border-cyber-glow'} px-1 py-1 outline-none`} />
                                        <button type="submit" className="px-2 py-1 text-cyber-muted hover:text-cyber-glow hover:bg-cyber-glow/10 transition-colors">[ENTRAR]</button>
                                    </form>
                                )}
                            </div>
                        </header>

                        {/* BARRA DE FILTRO */}
                        <div className="mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <input 
                                type="text" 
                                placeholder="> Buscar colaborador..." 
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="cyber-input w-full md:w-1/3 p-2 text-sm font-mono rounded"
                            />
                            
                            <div className="text-xs font-mono text-cyber-glow bg-cyber-glow/5 border border-cyber-glow/10 px-3 py-2 rounded">
                                🌐 Sincronização automática em nuvem ativa para todos os navegadores.
                            </div>
                        </div>

                        {/* TABELA */}
                        <div className="bg-cyber-panel border border-cyber-border rounded-lg shadow-2xl overflow-hidden mb-6">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-[#18181b] border-b border-cyber-border text-xs font-mono text-cyber-muted uppercase">
                                            <th className="p-4 font-semibold w-1/5">Colaborador</th>
                                            <th className="p-4 font-semibold text-center w-32">Atrasos</th>
                                            <th className="p-4 font-semibold">Histórico de Justificativas</th>
                                            <th className="p-4 font-semibold text-center w-40">Remotos Perdidos</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-cyber-border text-sm font-mono">
                                        {colaboradoresFiltrados.length === 0 ? (
                                            <tr><td colSpan="4" className="p-4 text-center text-cyber-muted">Nenhum registro encontrado.</td></tr>
                                        ) : colaboradoresFiltrados.map((colab) => {
                                            const totalRemotos = Math.max(0, Math.floor(colab.atrasos / 2) + (colab.remotosPerdidos || 0));
                                            const historico = colab.justificativa ? colab.justificativa.split(';') : [];

                                            return (
                                                <tr key={colab.id} className="hover:bg-white/[0.02] transition-colors">
                                                    <td className="p-4 font-sans font-medium text-cyber-text align-top pt-5">
                                                        {colab.nome}
                                                    </td>
                                                    
                                                    <td className="p-4 text-center align-top pt-4">
                                                        <div className="flex items-center justify-center gap-2">
                                                            {isAdmin && (
                                                                <button onClick={() => alterarAtraso(colab.id, colab.nome, -1)}
                                                                    className="text-cyber-muted hover:text-cyber-glow w-6 h-6 rounded bg-white/5 hover:bg-cyber-glow/20 flex items-center justify-center font-bold"
                                                                >-</button>
                                                            )}
                                                            <span className={`text-lg font-bold w-6 inline-block text-center ${colab.atrasos > 0 ? 'text-cyber-glow' : 'text-cyber-muted'}`}>
                                                                {colab.atrasos}
                                                            </span>
                                                            {isAdmin && (
                                                                <button onClick={() => alterarAtraso(colab.id, colab.nome, 1)}
                                                                    className="text-cyber-muted hover:text-cyber-glow w-6 h-6 rounded bg-white/5 hover:bg-cyber-glow/20 flex items-center justify-center font-bold"
                                                                >+</button>
                                                            )}
                                                        </div>
                                                    </td>
                                                    
                                                    <td className="p-4">
                                                        <div className="flex flex-col gap-2">
                                                            {historico.length > 0 && (
                                                                <div className="text-xs text-cyber-muted max-h-24 overflow-y-auto pr-2 space-y-1">
                                                                    {historico.map((j, i) => j.trim() && (
                                                                        <div key={i} className="bg-black/30 px-2 py-1 border-l-2 border-cyber-border">
                                                                            {j.trim()}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}
                                                            {isAdmin ? (
                                                                <input 
                                                                    type="text"
                                                                    onKeyDown={(e) => handleJustificativaKeyDown(e, colab.id, colab.nome, colab.justificativa)}
                                                                    placeholder="> Justificativa e Enter..."
                                                                    className="cyber-input w-full p-2 text-xs rounded bg-transparent mt-1 placeholder-cyber-muted/40"
                                                                />
                                                            ) : (
                                                                historico.length === 0 && <span className="text-xs text-cyber-muted/30">Nenhum histórico.</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    
                                                    <td className="p-4 text-center align-top pt-4">
                                                        <div className="flex items-center justify-center gap-2">
                                                            {isAdmin && (
                                                                <button onClick={() => alterarRemotosPerdidos(colab.id, colab.nome, -1)}
                                                                    className="text-cyber-muted hover:text-cyber-danger w-6 h-6 rounded bg-white/5 hover:bg-cyber-danger/20 flex items-center justify-center font-bold"
                                                                >-</button>
                                                            )}
                                                            <div className={`inline-flex items-center justify-center px-3 py-1 rounded border min-w-[60px] ${totalRemotos > 0 ? 'border-cyber-danger/40 text-cyber-danger bg-cyber-danger/5' : 'border-cyber-border text-cyber-muted bg-transparent'}`}>
                                                                {totalRemotos > 0 && <span className="mr-1.5 animate-pulse">⚠</span>}
                                                                <span className="font-bold inline-block text-center w-4">
                                                                    {totalRemotos}
                                                                </span>
                                                            </div>
                                                            {isAdmin && (
                                                                <button onClick={() => alterarRemotosPerdidos(colab.id, colab.nome, 1)}
                                                                    className="text-cyber-muted hover:text-cyber-danger w-6 h-6 rounded bg-white/5 hover:bg-cyber-danger/20 flex items-center justify-center font-bold"
                                                                >+</button>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* CONSOLE DE AUDITORIA */}
                        <div className="bg-[#050505] border border-cyber-border rounded-lg p-4 font-mono text-xs shadow-inner">
                            <div className="text-cyber-glow mb-2 flex items-center gap-2 uppercase font-bold tracking-wider">
                                <span className="w-2 h-2 bg-cyber-glow rounded-full animate-pulse"></span>
                                Log_Streamer
                            </div>
                            <div className="flex flex-col gap-1 text-cyber-muted h-20 overflow-hidden">
                                {logs.map((log, i) => (
                                    <div key={i} className={`${log.includes('AUTH:') ? 'text-emerald-400' : log.includes('ADMIN:') ? 'text-cyber-text' : log.includes('ERROR:') ? 'text-cyber-danger' : 'text-cyber-muted'}`}>
                                        {log}
                                    </div>
                                ))}
                            </div>
                        </div>
                        
                    </div> 
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
